[package]
name = "allypad-sender"
version = "0.1.0"
edition = "2021"

[dependencies]
allypad-proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.13"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_Input_XboxController", "Win32_System_LibraryLoader", "Win32_Media", "Win32_System_Power", "Win32_System_WinRT", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Devices_Sensors", "Foundation"] }

[build-dependencies]
embed-resource = "2"
