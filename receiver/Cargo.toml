[package]
name = "allypad-receiver"
version = "0.1.0"
edition = "2021"

[dependencies]
allypad-proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.13"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media", "Win32_System_Power", "Win32_System_Console", "Win32_System_Threading", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "2"
