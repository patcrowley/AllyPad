name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force AllyPad | Out-Null
          Copy-Item target/release/allypad-sender.exe, target/release/allypad-receiver.exe, README.md AllyPad/
          Compress-Archive -Path AllyPad -DestinationPath AllyPad.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AllyPad
          path: AllyPad.zip
      # A release is published the first time a build of main carries a
      # version (the VERSION file) that has no release yet. To cut a new
      # release, change VERSION and RELEASE_NOTES.md and push.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v" + (Get-Content VERSION -Raw).Trim()
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag is already released."
            exit 0
          }
          gh release create $tag AllyPad.zip --target $env:GITHUB_SHA --title "AllyPad $tag" --notes-file RELEASE_NOTES.md
